version: 2

models:
  - name: dim_patient
    description: "Dimension table containing anonymized patient demographic and enrollment data."
    columns:
      - name: patient_id
        tests:
          - unique
          - not_null
      - name: trial_id
        tests:
          - not_null
      - name: age
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 18
              max_value: 100
              mostly: 1.0

  - name: fct_visit
    description: "Fact table containing clinical trial visit records."
    columns:
      - name: visit_id
        tests:
          - unique
          - not_null
      - name: patient_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_patient')
              field: patient_id
      - name: visit_date
        tests:
          - dbt_expectations.expect_column_values_to_be_of_type:
              column_type: date
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: "2020-01-01"
              max_value: "2035-12-31"
              mostly: 1.0
      - name: visit_status
        tests:
          - accepted_values:
              values: ['Completed', 'Scheduled', 'Missed', 'Cancelled']

  - name: fct_lab_result
    description: "Fact table containing laboratory analyte measurements."
    columns:
      - name: lab_result_id
        tests:
          - unique
          - not_null
      - name: result_value
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 10000  # Prevent impossible biological values
              mostly: 1.0
      - name: is_out_of_range
        tests:
          - accepted_values:
              values: [true, false]